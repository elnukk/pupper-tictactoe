# The ELP 16MP USB camera's lens (board/usb_camera.py), in board_vision's lens
# model. xi = 0 and alpha = 0 make it a plain pinhole lens (no fisheye).
#
# fx/fy are a first guess (about 85 degrees across). Reading the board doesn't
# depend on them; only the board's distance and pose (stamping) do.
size: [2048, 1536]  # the frame size these numbers are for; other sizes are scaled
camera_params:
  fx: 1100.0
  fy: 1100.0
  cx: 1023.5
  cy: 767.5
  xi: 0.0
  alpha: 0.0
