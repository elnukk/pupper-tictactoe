# sit_stay_shake: fetched with get_trick.py. Edit the description -- it is what Gemini reads
# when deciding whether to play this trick.
description: >
  Pupper sits down and STAYS sitting until told otherwise. Use it for any plain
  "sit" or "sit down", not only when shaking or staying is mentioned. While
  sitting, Pupper takes requests with interactive_action: shake a paw, or
  stand up. Any other motion (walk, turn, another trick) makes it stand up first.
type: policy
policy: policy.json
start_pose: standing
end_pose: sitting
max_body_angle_deg: 60   # the sit leans back about 35 degrees
actions:
  shake_left: Lifts Pupper's own LEFT front paw to shake hands (the paw on the person's right when facing Pupper), then keeps sitting.
  shake_right: Lifts Pupper's own RIGHT front paw to shake hands (the paw on the person's left when facing Pupper), then keeps sitting.
  stand_up: Stands up from sitting and can walk again. This ends the trick.
exit_clip: stand_up